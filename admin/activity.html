<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs - CampusEventHub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div id="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand">
                    <i class="fa-solid fa-shield-halved"></i> Admin Portal
                </a>
            </div>
            <nav class="sidebar-nav">
                <span class="sidebar-heading">Core</span>
                <a href="dashboard.html" class="nav-link-custom"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="users.html" class="nav-link-custom"><i class="fa-solid fa-users"></i> Users Management</a>
                <a href="event-approvals.html" class="nav-link-custom"><i class="fa-solid fa-clipboard-check"></i> Event Approvals</a>
                
                <span class="sidebar-heading">Analytics & System</span>
                <a href="statistics.html" class="nav-link-custom"><i class="fa-solid fa-chart-pie"></i> Statistics</a>
                <a href="activity.html" class="nav-link-custom active"><i class="fa-solid fa-clock-rotate-left"></i> Activity Logs</a>
                <a href="settings.html" class="nav-link-custom"><i class="fa-solid fa-sliders"></i> System Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar current-user-avatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name current-user-name">Admin User</div>
                        <div class="sidebar-user-role current-user-role">ADMIN</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main-wrapper">
            
            <header class="top-navbar">
                <div class="left-controls">
                    <button class="sidebar-toggle-btn" type="button"><i class="fa-solid fa-bars"></i></button>
                    <h5 class="fw-bold m-0 d-none d-md-block">Real-time Activity Audit</h5>
                </div>
                <div class="right-controls">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle" id="adminProfileDrop" data-bs-toggle="dropdown">
                            <div class="sidebar-user-avatar bg-primary me-2 current-user-avatar">A</div>
                            <span class="fw-semibold d-none d-sm-inline current-user-name">Admin User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><a class="dropdown-item text-danger" href="#" onclick="Auth.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <main class="dashboard-body">
                
                <div class="page-header">
                    <div>
                        <h2 class="page-title">Activity Feed</h2>
                        <p class="page-subtitle">Real-time monitor of system events, logins, purchases, and approvals</p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-light text-muted border py-2 px-3" id="last-updated-label">
                            <i class="fa-solid fa-sync fa-spin me-1 text-primary"></i> Last updated: Just now
                        </span>
                        <button id="manual-refresh-btn" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-rotate-right me-1"></i> Refresh</button>
                    </div>
                </div>

                <!-- Action Type Filter Card -->
                <div class="card card-custom p-3 mb-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" id="activity-search-input" class="form-control" placeholder="Search user or description...">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <select id="activity-type-filter" class="form-select">
                                <option value="ALL">All Actions</option>
                                <option value="User Login">User Login</option>
                                <option value="User Registered">User Registered</option>
                                <option value="Event Created">Event Created</option>
                                <option value="Event Approved">Event Approved</option>
                                <option value="Event Rejected">Event Rejected</option>
                                <option value="Ticket Purchased">Ticket Purchased</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Activity Log Table -->
                <div class="card card-custom">
                    <div class="table-responsive" id="activity-table-container">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

            </main>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/admin/activity.js"></script>
</body>
</html>
