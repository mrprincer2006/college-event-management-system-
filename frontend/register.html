<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Event Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 480px;">
            
            <div class="auth-header">
                <a href="index.html" class="auth-brand text-decoration-none">
                    <i class="fa-solid fa-calendar-check"></i> CampusEventHub
                </a>
                <p class="auth-subtitle">Create a new account</p>
            </div>

            <div id="register-alert-container"></div>

            <!-- Registration Form -->
            <form id="register-form" class="auth-form" novalidate>
                <div class="mb-3">
                    <label for="fullname" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-regular fa-user"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" id="fullname" placeholder="e.g. Rahul Sharma" required>
                    </div>
                    <div class="invalid-feedback">Please enter your full name.</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="name@domain.com" required>
                    </div>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Account Role</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-user-gear"></i></span>
                        <select class="form-select border-start-0 ps-0" id="role" required>
                            <option value="ATTENDEE" selected>Attendee (Browse & Buy Tickets)</option>
                            <option value="ORGANIZER">Event Organizer (Create & Host Events)</option>
                        </select>
                    </div>
                    <div class="form-text small">Admin accounts are provisioned separately by system administrators.</div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" minlength="6" placeholder="Min 6 chars" required>
                        <div class="invalid-feedback">At least 6 characters required.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" placeholder="Re-enter password" required>
                        <div class="invalid-feedback" id="confirm-pwd-feedback">Passwords must match.</div>
                    </div>
                </div>

                <button type="submit" id="register-submit-btn" class="btn btn-primary w-100 py-2.5 mb-3 fw-semibold">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <span class="text-muted small">Already have an account?</span>
                <a href="login.html" class="fw-semibold ms-1 small">Sign In</a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const registerForm = document.getElementById("register-form");

            registerForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                e.stopPropagation();

                const nameInput = document.getElementById("fullname");
                const emailInput = document.getElementById("email");
                const roleInput = document.getElementById("role");
                const passwordInput = document.getElementById("password");
                const confirmInput = document.getElementById("confirm_password");
                const alertContainer = document.getElementById("register-alert-container");

                const nameVal = nameInput.value.trim();
                const emailVal = emailInput.value.trim();
                const roleVal = roleInput.value;
                const pwdVal = passwordInput.value;
                const confirmVal = confirmInput.value;

                let isValid = true;
                if (!nameVal || !Utils.isValidEmail(emailVal) || pwdVal.length < 6) {
                    isValid = false;
                }

                if (pwdVal !== confirmVal) {
                    confirmInput.setCustomValidity("Passwords do not match");
                    isValid = false;
                } else {
                    confirmInput.setCustomValidity("");
                }

                registerForm.classList.add("was-validated");

                if (!isValid) return;

                const submitBtn = document.getElementById("register-submit-btn");
                UI.setBtnLoading(submitBtn, true, "Creating Account...");
                alertContainer.innerHTML = "";

                try {
                    const res = await API.register(nameVal, emailVal, pwdVal, roleVal);
                    if (res.success) {
                        UI.showToast(res.message, "success");
                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, 1000);
                    } else {
                        alertContainer.innerHTML = `<div class="alert alert-danger mb-3 py-2 small">${Utils.escapeHtml(res.message)}</div>`;
                    }
                } catch (err) {
                    alertContainer.innerHTML = `<div class="alert alert-danger mb-3 py-2 small">${Utils.escapeHtml(err.message)}</div>`;
                } finally {
                    UI.setBtnLoading(submitBtn, false);
                }
            });
        });
    </script>
</body>
</html>
