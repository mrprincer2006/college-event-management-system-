<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Events - CampusEventHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/attendee.css">
</head>
<body>

    <div id="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand">
                    <i class="fa-solid fa-calendar-check"></i> Student Portal
                </a>
            </div>
            <nav class="sidebar-nav">
                <span class="sidebar-heading">Explore & Book</span>
                <a href="dashboard.html" class="nav-link-custom"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="events.html" class="nav-link-custom active"><i class="fa-solid fa-compass"></i> Browse Events</a>
                <a href="my-tickets.html" class="nav-link-custom"><i class="fa-solid fa-ticket"></i> My Passes & Tickets</a>
                <a href="registrations.html" class="nav-link-custom"><i class="fa-solid fa-clipboard-list"></i> Registrations History</a>
                
                <span class="sidebar-heading">Account</span>
                <a href="notifications.html" class="nav-link-custom"><i class="fa-solid fa-bell"></i> Notifications</a>
                <a href="profile.html" class="nav-link-custom"><i class="fa-solid fa-user-gear"></i> Profile Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar current-user-avatar">R</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name current-user-name">Rahul Sharma</div>
                        <div class="sidebar-user-role current-user-role">ATTENDEE</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main-wrapper">
            
            <header class="top-navbar">
                <div class="left-controls">
                    <button class="sidebar-toggle-btn" type="button"><i class="fa-solid fa-bars"></i></button>
                    <h5 class="fw-bold m-0 d-none d-md-block">Explore Events</h5>
                </div>
                <div class="right-controls">
                    <a href="notifications.html" class="nav-icon-btn text-decoration-none">
                        <i class="fa-regular fa-bell"></i>
                    </a>
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle" id="attProfileDrop" data-bs-toggle="dropdown">
                            <div class="sidebar-user-avatar bg-primary me-2 current-user-avatar">R</div>
                            <span class="fw-semibold d-none d-sm-inline current-user-name">Rahul Sharma</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><a class="dropdown-item" href="profile.html"><i class="fa-solid fa-user me-2"></i> My Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="Auth.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <main class="dashboard-body">
                
                <div class="page-header">
                    <div>
                        <h2 class="page-title">Browse All Events</h2>
                        <p class="page-subtitle">Filter by category, city, date, or search keywords</p>
                    </div>
                </div>

                <!-- Comprehensive Filter Panel -->
                <div class="card card-custom p-3 mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="att-search-input" class="form-label fw-bold small">Search Keyword:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" id="att-search-input" class="form-control" placeholder="Search event title, venue...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label for="att-category-filter" class="form-label fw-bold small">Category:</label>
                            <select id="att-category-filter" class="form-select">
                                <option value="ALL">All Categories</option>
                                <option value="Technology">Technology</option>
                                <option value="Music">Music</option>
                                <option value="Business">Business</option>
                                <option value="Sports">Sports</option>
                                <option value="Education">Education</option>
                                <option value="Arts">Arts</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="att-city-filter" class="form-label fw-bold small">City / Location:</label>
                            <select id="att-city-filter" class="form-select">
                                <option value="ALL">All Cities</option>
                                <option value="Bengaluru">Bengaluru</option>
                                <option value="Mumbai">Mumbai</option>
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Goa">Goa</option>
                                <option value="Pune">Pune</option>
                                <option value="Chennai">Chennai</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button id="att-reset-filters" class="btn btn-outline-secondary w-100"><i class="fa-solid fa-rotate-left me-1"></i> Reset</button>
                        </div>
                    </div>
                </div>

                <!-- Events Grid -->
                <div class="row g-4" id="att-events-browse-container">
                    <!-- Dynamically populated -->
                </div>

            </main>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/attendee/events.js"></script>
</body>
</html>
