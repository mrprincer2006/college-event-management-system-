<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details & Booking - CampusEventHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/attendee.css">
</head>
<body>

    <div id="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand">
                    <i class="fa-solid fa-calendar-check"></i> Student Portal
                </a>
            </div>
            <nav class="sidebar-nav">
                <span class="sidebar-heading">Explore & Book</span>
                <a href="dashboard.html" class="nav-link-custom"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="events.html" class="nav-link-custom active"><i class="fa-solid fa-compass"></i> Browse Events</a>
                <a href="my-tickets.html" class="nav-link-custom"><i class="fa-solid fa-ticket"></i> My Passes & Tickets</a>
                <a href="registrations.html" class="nav-link-custom"><i class="fa-solid fa-clipboard-list"></i> Registrations History</a>
                
                <span class="sidebar-heading">Account</span>
                <a href="notifications.html" class="nav-link-custom"><i class="fa-solid fa-bell"></i> Notifications</a>
                <a href="profile.html" class="nav-link-custom"><i class="fa-solid fa-user-gear"></i> Profile Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar current-user-avatar">R</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name current-user-name">Rahul Sharma</div>
                        <div class="sidebar-user-role current-user-role">ATTENDEE</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main-wrapper">
            
            <header class="top-navbar">
                <div class="left-controls">
                    <button class="sidebar-toggle-btn" type="button"><i class="fa-solid fa-bars"></i></button>
                    <h5 class="fw-bold m-0 d-none d-md-block">Event & Ticket Details</h5>
                </div>
                <div class="right-controls">
                    <a href="notifications.html" class="nav-icon-btn text-decoration-none">
                        <i class="fa-regular fa-bell"></i>
                    </a>
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle" id="attProfileDrop" data-bs-toggle="dropdown">
                            <div class="sidebar-user-avatar bg-primary me-2 current-user-avatar">R</div>
                            <span class="fw-semibold d-none d-sm-inline current-user-name">Rahul Sharma</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><a class="dropdown-item" href="profile.html"><i class="fa-solid fa-user me-2"></i> My Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="Auth.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <main class="dashboard-body" id="event-detail-content-area">
                <!-- Dynamically populated via JS -->
            </main>
        </div>

    </div>

    <!-- Simulated Payment Modal -->
    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-shield-halved text-success me-2"></i>Complete Booking Payment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-3">
                    
                    <div class="bg-light p-3 rounded-3 mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted small">Selected Pass:</span>
                            <span class="fw-bold small" id="pay-modal-ticket-name">Regular</span>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted small">Quantity:</span>
                            <span class="fw-bold small" id="pay-modal-qty">1</span>
                        </div>
                        <hr class="my-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold">Total Amount:</span>
                            <span class="fs-5 fw-bold text-primary" id="pay-modal-total">₹0</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="payment-method-select" class="form-label fw-semibold">Select Payment Method</label>
                        <select id="payment-method-select" class="form-select">
                            <option value="UPI" selected>UPI (Google Pay / PhonePe / Paytm)</option>
                            <option value="CARD">Credit / Debit Card</option>
                            <option value="NET_BANKING">Net Banking</option>
                            <option value="CASH">Cash at Desk</option>
                        </select>
                    </div>

                    <div class="mb-3" id="upi-details-field">
                        <label for="upi-id-input" class="form-label small text-muted">Enter Virtual Payment Address (VPA)</label>
                        <input type="text" id="upi-id-input" class="form-control" placeholder="user@upi" value="student@okaxis">
                    </div>

                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirm-payment-btn" class="btn btn-primary px-4 fw-semibold">
                        <i class="fa-solid fa-lock me-1"></i> Pay & Register
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/attendee/event-details.js"></script>
</body>
</html>
