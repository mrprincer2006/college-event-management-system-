<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Event Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <a href="index.html" class="auth-brand text-decoration-none">
                    <i class="fa-solid fa-calendar-check"></i> CampusEventHub
                </a>
                <p class="auth-subtitle">Sign in to access your portal</p>
            </div>

            <!-- Mock Login Credentials Hint -->
            <div class="mock-hint-box" id="mock-credentials-hint">
                <div class="fw-semibold mb-1"><i class="fa-solid fa-lightbulb me-1"></i> Demo Quick Login Credentials:</div>
                <div class="d-flex flex-wrap gap-1 mt-2">
                    <button type="button" class="btn btn-xs btn-outline-primary py-1 px-2 text-nowrap" style="font-size:0.75rem" onclick="quickFill('admin@event.com','admin123')">Admin</button>
                    <button type="button" class="btn btn-xs btn-outline-primary py-1 px-2 text-nowrap" style="font-size:0.75rem" onclick="quickFill('organizer@event.com','org123')">Organizer</button>
                    <button type="button" class="btn btn-xs btn-outline-primary py-1 px-2 text-nowrap" style="font-size:0.75rem" onclick="quickFill('attendee@event.com','att123')">Attendee</button>
                </div>
            </div>

            <!-- Alert Container -->
            <div id="login-alert-container"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="name@domain.com" required>
                    </div>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="••••••••" required>
                        <button class="btn password-toggle-btn px-3" type="button" id="toggle-password">
                            <i class="fa-regular fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>

                <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2.5 mb-3 fw-semibold">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <span class="text-muted small">Don't have an account?</span>
                <a href="register.html" class="fw-semibold ms-1 small">Register as Attendee/Organizer</a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Password toggle
            const togglePasswordBtn = document.getElementById("toggle-password");
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eye-icon");

            togglePasswordBtn.addEventListener("click", () => {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                eyeIcon.className = type === "password" ? "fa-regular fa-eye" : "fa-regular fa-eye-slash";
            });

            // Form Submit
            const loginForm = document.getElementById("login-form");
            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                e.stopPropagation();

                const emailInput = document.getElementById("email");
                const passwordVal = passwordInput.value.trim();
                const emailVal = emailInput.value.trim();
                const alertContainer = document.getElementById("login-alert-container");

                loginForm.classList.add("was-validated");

                if (!Utils.isValidEmail(emailVal) || !passwordVal) {
                    return;
                }

                const submitBtn = document.getElementById("login-submit-btn");
                UI.setBtnLoading(submitBtn, true, "Signing in...");
                alertContainer.innerHTML = "";

                try {
                    const res = await API.login(emailVal, passwordVal);
                    if (res.success && res.data) {
                        Auth.setSession(res.data);
                        UI.showToast("Login successful! Redirecting...", "success");

                        setTimeout(() => {
                            if (res.data.role === "ADMIN") window.location.href = "admin/dashboard.html";
                            else if (res.data.role === "ORGANIZER") window.location.href = "organizer/dashboard.html";
                            else window.location.href = "attendee/dashboard.html";
                        }, 500);
                    } else {
                        alertContainer.innerHTML = `<div class="alert alert-danger mb-3 py-2 small">${Utils.escapeHtml(res.message || 'Login failed')}</div>`;
                    }
                } catch (err) {
                    alertContainer.innerHTML = `<div class="alert alert-danger mb-3 py-2 small">${Utils.escapeHtml(err.message)}</div>`;
                } finally {
                    UI.setBtnLoading(submitBtn, false);
                }
            });
        });

        function quickFill(email, pwd) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = pwd;
        }
    </script>
</body>
</html>
